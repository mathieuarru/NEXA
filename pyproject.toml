[tool.poetry]
name = "nexa"
version = "1.0.0"
description = "An inspectable framework for querying biomedical knowledge graphs in natural language, grounded in explicit Cypher queries."
authors = ["Mathieu Arru <mathieu.arru@crchudequebec.ulaval.ca>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/mathieuarru/NEXA"
keywords = ["knowledge-graph", "biomedical", "llm", "neo4j", "cypher", "question-answering", "langgraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.dependencies]
python = "~3.13"
ollama = "0.6.2"
langchain-ollama = "1.1.0"
neo4j = "6.2.0"
pandas = "3.0.2"
langchain-openai = "1.2.1"
langchain-anthropic = "1.4.3"
streamlit = "1.57.0"
langchain-community = "0.4.1"
psycopg = "3.3.4"
langgraph-checkpoint-postgres = "3.0.5"
fastapi = "0.136.1"
uvicorn = "0.46.0"
st-link-analysis = "0.4.0"
langgraph = "1.1.10"
python-multipart = "0.0.27"
dill = "0.4.1"
python-dotenv = "1.2.2"
langchain-google-genai = "4.2.2"
langchain = "1.2.17"
langchain-core = "1.3.2"


[tool.poetry.group.dev.dependencies]
ipykernel = "6.29.5"
jupyter = "1.1.1"
pytest = "8.4.2"
matplotlib = "3.11.1"
scipy = "1.18.1"


[tool.poetry.group.benchmark.dependencies]
langchain-neo4j = {version = "0.10.0", python = ">=3.13,<3.15"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
